plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.ksp)
    alias(libs.plugins.hilt)
    alias(libs.plugins.react.native)
}

// ============================================================================
// BARE MINIMUM React Native Configuration
// ============================================================================

def reactNativeVersion = "0.81.5"
def jsProjectRoot = file("$rootDir/../skydio-rn-business-logic")
def workspaceRoot = file("$rootDir/..")
def nodeModulesRoot = file("$workspaceRoot/node_modules")

android {
    namespace 'com.example.skydioandroidapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.skydioandroidapp"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // React Native build config - enable new architecture
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", "true"
        buildConfigField "boolean", "IS_HERMES_ENABLED", "true"
        buildConfigField "boolean", "IS_EDGE_TO_EDGE_ENABLED", "false"
    }

    buildTypes {
        debug {
            // Enable developer support in debug builds
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign with debug key for testing
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
}

// React Native configuration (node_modules hoisted to workspace root)
react {
    root = jsProjectRoot
    reactNativeDir = file("$nodeModulesRoot/react-native")
    codegenDir = file("$nodeModulesRoot/@react-native/codegen")
    cliFile = file("$nodeModulesRoot/react-native/cli.js")
    entryFile = file("$jsProjectRoot/index.js")
    hermesCommand = "$nodeModulesRoot/react-native/sdks/hermesc/%OS-BIN%/hermesc"
}

dependencies {
    // React Native (BARE MINIMUM)
    implementation("com.facebook.react:react-android:$reactNativeVersion")
    implementation("com.facebook.react:hermes-android:$reactNativeVersion")

    // Coroutines for async operations
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // Hilt
    implementation libs.hilt.android
    ksp libs.hilt.compiler

    // AndroidX
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation "androidx.fragment:fragment-ktx:1.8.5"

    // Compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material3.adaptive.navigation.suite

    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest
}

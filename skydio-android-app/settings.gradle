pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }

    // Bootstrap: Install JS dependencies if node_modules doesn't exist
    // Note: npm workspaces hoists dependencies to root node_modules
    def workspaceRoot = file("..")
    def nodeModules = file("${workspaceRoot}/node_modules")
    if (!nodeModules.exists()) {
        println("Installing JS dependencies (first-time setup)...")
        def process = new ProcessBuilder("npm", "install")
            .directory(workspaceRoot)
            .redirectErrorStream(true)
            .start()
        process.inputStream.eachLine { println(it) }
        def exitCode = process.waitFor()
        if (exitCode != 0) {
            throw new GradleException("npm install failed with exit code ${exitCode}")
        }
        println("JS dependencies installed successfully")
    }

    // Include React Native Gradle Plugin from npm package (hoisted to root)
    includeBuild("../node_modules/@react-native/gradle-plugin")
}

plugins {
    // Apply React Native settings plugin for autolinking
    id("com.facebook.react.settings")
}

// Path to the JS project (relative to this settings.gradle)
def jsProjectRoot = file("../skydio-rn-business-logic")

// Configure autolinking to run from the JS project directory
reactSettings {
    autolinkLibrariesFromCommand(
        // Use the default command: npx @react-native-community/cli config
        ["npx", "@react-native-community/cli", "config"],
        // Run from the JS project directory
        jsProjectRoot,
        // Lock files to watch for changes (relative to JS project)
        files(
            "${jsProjectRoot}/yarn.lock",
            "${jsProjectRoot}/package-lock.json",
            "${jsProjectRoot}/package.json",
            "${jsProjectRoot}/react-native.config.js"
        )
    )
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
        // React Native Maven repository (from npm package, hoisted to root)
        maven {
            url("$rootDir/../node_modules/react-native/android")
        }
    }
}

rootProject.name = "SkydioAndroidApp"
include ':app'
